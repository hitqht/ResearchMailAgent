name: M0 checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.12"
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups
      - run: bash scripts/check.sh
      - run: uv run --locked python scripts/gui_smoke.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: uv build --wheel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-validation
          path: |
            artifacts/gui/
            coverage.xml
            dist/*.whl
          retention-days: 7
