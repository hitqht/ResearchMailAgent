[project]
name = "researchmail-agent"
version = "0.1.0"
description = "A privacy-first macOS research mail assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "httpx>=0.28,<1",
  "keyring>=25,<26",
  "pydantic>=2.10,<3",
]

[project.scripts]
researchmail-agent = "researchmail.app:main"

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "detect-secrets>=1.5,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pytest-qt>=4.4,<5",
  "ruff>=0.11,<1",
]
build = ["pyinstaller>=6.12,<7"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/researchmail"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/researchmail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["researchmail"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_also = ["if __name__ == .__main__.:"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
